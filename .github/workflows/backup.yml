name: Backup database

# Il piano Neon Free ha solo 6 ore di point-in-time recovery e non supporta gli snapshot
# programmati (verificato via API: "backup schedule creation is not enabled for this project").
# Questo workflow è quindi l'unico backup reale oltre quella finestra di 6 ore: un dump logico
# completo del database di produzione, ogni giorno, conservato come artifact per 90 giorni.
# Vedi DISASTER-RECOVERY.md per la procedura di ripristino, testata.
on:
  schedule:
    - cron: "0 3 * * *" # ogni giorno alle 03:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    # Versione fissata: dal 19/10/2026 ubuntu-latest passa a Ubuntu 26, e il repository apt di
    # PostgreSQL potrebbe non avere ancora i pacchetti per la nuova release (lsb_release -cs sotto).
    runs-on: ubuntu-24.04
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Il secret NEON_DATABASE_URL non è impostato (Settings > Secrets and variables > Actions)." >&2
            echo "Usa la connection string Neon della stessa istanza usata da Render/dallo sviluppo locale." >&2
            exit 1
          fi
          FILENAME="crmmes-backup-$(date -u +%Y%m%d-%H%M%S).dump"

          # Il secret è la stessa stringa usata da Render/dall'API, cioè in formato Npgsql
          # ("Host=...;Port=5432;Database=...;Username=...;Password=...;SSL Mode=Require"), che pg_dump
          # (libpq) non capisce: falliva subito, ogni notte. Se non è già un URI postgres://, la
          # traduciamo nelle variabili d'ambiente standard di libpq (niente problemi di quoting).
          if [[ "$DATABASE_URL" == postgres://* || "$DATABASE_URL" == postgresql://* ]]; then
            TARGET="$DATABASE_URL"
          else
            IFS=';' read -ra PARTS <<< "$DATABASE_URL"
            for PART in "${PARTS[@]}"; do
              [ -z "${PART// /}" ] && continue
              KEY="$(echo "${PART%%=*}" | tr -d ' ' | tr '[:upper:]' '[:lower:]')"
              VALUE="$(echo "${PART#*=}" | sed 's/^ *//;s/ *$//')"
              case "$KEY" in
                host|server) export PGHOST="$VALUE" ;;
                port) export PGPORT="$VALUE" ;;
                database|db) export PGDATABASE="$VALUE" ;;
                username|userid|user|uid) export PGUSER="$VALUE" ;;
                password|pwd) echo "::add-mask::$VALUE"; export PGPASSWORD="$VALUE" ;;
                sslmode) export PGSSLMODE="$(echo "$VALUE" | tr '[:upper:]' '[:lower:]')" ;;
                channelbinding) export PGCHANNELBINDING="$(echo "$VALUE" | tr '[:upper:]' '[:lower:]')" ;;
              esac
            done
            if [ -z "$PGHOST" ] || [ -z "$PGDATABASE" ] || [ -z "$PGUSER" ]; then
              echo "La connection string non contiene Host, Database e Username: formato non riconosciuto." >&2
              exit 1
            fi
            # "Require" di Npgsql non verifica il certificato, come "require" di libpq: equivalenti.
            export PGSSLMODE="${PGSSLMODE:-require}"
            TARGET=""
          fi

          if [ -n "$TARGET" ]; then
            /usr/lib/postgresql/18/bin/pg_dump "$TARGET" --format=custom --no-owner --no-privileges -f "$FILENAME"
          else
            /usr/lib/postgresql/18/bin/pg_dump --format=custom --no-owner --no-privileges -f "$FILENAME"
          fi

          # Un dump vuoto o troncato non è un backup: meglio fallire che archiviarlo come valido.
          /usr/lib/postgresql/18/bin/pg_restore --list "$FILENAME" > /dev/null
          echo "Backup creato: $FILENAME ($(du -h "$FILENAME" | cut -f1))"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 90
