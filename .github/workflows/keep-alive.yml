name: Keep API awake

# Render's Free plan spins the service down after ~15 minutes without incoming requests; the next real
# request then waits 30-60s for a cold start. The API keeps itself awake once it is running (see
# KeepWarmService), but once stopped it can't wake itself: this external ping restarts it.
#
# Every 5 minutes: /health during working hours (Mon-Sat 6:00-20:00 Italian time, also wakes the Neon
# database so the first login is fast), /ping otherwise (keeps the web service up without keeping the
# database, billed by compute time, awake all night).
#
# Limitation: GitHub's scheduler is best-effort - it can run late or skip runs under load, and it is
# disabled after 60 days without commits. For a guaranteed interval add a free external monitor (e.g.
# cron-job.org or UptimeRobot) pointing at https://crmmes-api.onrender.com/ping every 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: |
          hour=$(TZ=Europe/Rome date +%-H)
          weekday=$(TZ=Europe/Rome date +%u)
          path=ping
          if [ "$weekday" -le 6 ] && [ "$hour" -ge 6 ] && [ "$hour" -lt 20 ]; then path=health; fi
          status=$(curl -s -o /dev/null -m 90 -w "%{http_code}" "https://crmmes-api.onrender.com/$path")
          echo "GET /$path responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::warning::API /$path did not return 200 (got $status) - service may be cold-starting or down."
          fi
