name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CrmMes.sln

      - name: Build
        run: dotnet build CrmMes.sln --no-restore --configuration Release

      - name: Test API
        run: dotnet test CrmMes.Api.Tests/CrmMes.Api.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Test Desktop client
        run: dotnet test CrmMes.Desktop.Tests/CrmMes.Desktop.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Test vendor console
        run: dotnet test CrmMes.Console.Tests/CrmMes.Console.Tests.csproj --no-build --configuration Release

      - name: Test web platform
        run: dotnet test CrmMes.Web.Tests/CrmMes.Web.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      # The installer is otherwise compiled only when a release tag is pushed: a mistake in the .iss
      # would surface as a failed release. Compiling it here too catches it at the first push.
      - name: Verify installer compiles
        shell: pwsh
        run: |
          # Ogni errore viene pubblicato come annotazione (::error::), leggibile anche senza accesso ai log.
          function Fail-WithOutput($what, $output) {
            $lines = @($output | ForEach-Object { "$_" } | Where-Object { $_.Trim() -ne "" })
            # Prima le righe con l'errore vero (Error, Unable, Couldn't, not found...), poi le ultime righe di contesto.
            $errs = @($lines | Where-Object { $_ -match "(?i)error|unable|couldn|not found|exception|fatal|invalid" }) | Select-Object -First 30
            $ctx = @($lines) | Select-Object -Last 8
            foreach ($line in ($errs + $ctx)) { Write-Host "::error title=$what::$line" }
            throw "$what fallito."
          }
          $out = dotnet publish CrmMes.Desktop/CrmMes.Desktop.csproj -c Release -r win-x64 --self-contained false -o publish 2>&1
          if ($LASTEXITCODE -ne 0) { Fail-WithOutput "Publish client" $out }
          $out = choco install innosetup --no-progress -y 2>&1
          if ($LASTEXITCODE -notin 0, 3010) { Fail-WithOutput "Installazione Inno Setup" $out }
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6", "C:\Program Files\Inno Setup 6", "$env:LOCALAPPDATA\Programs\Inno Setup 6" -Filter ISCC.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe non trovato dopo l'installazione di Inno Setup." }
          Write-Host "ISCC: $iscc"
          $out = & $iscc "/DMyAppVersion=0.0.0" installer\NicoloMES.iss 2>&1
          if ($LASTEXITCODE -ne 0) { Fail-WithOutput "Compilazione installer client" $out }
          $out = dotnet publish CrmMes.Api/CrmMes.Api.csproj -c Release -r win-x64 --self-contained true -o publish-server 2>&1
          if ($LASTEXITCODE -ne 0) { Fail-WithOutput "Publish server" $out }
          $out = & $iscc "/DMyAppVersion=0.0.0" installer\NicoloMES-Server.iss 2>&1
          if ($LASTEXITCODE -ne 0) { Fail-WithOutput "Compilazione installer server" $out }
          foreach ($script in Get-ChildItem server\windows\*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Errore di sintassi in $($script.Name): $($errors[0].Message)" }
          }

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            CrmMes.Api.Tests/TestResults/test-results.trx
            CrmMes.Desktop.Tests/TestResults/test-results.trx
            CrmMes.Web.Tests/TestResults/test-results.trx
